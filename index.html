<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>もしもし — 일본어 통화 연습</title>
<style>
  :root{
    --night:#1a1c2e; --night-2:#242741; --paper:#f4f1ea;
    --coral:#e8836b; --jade:#7fb0a3; --gold:#e6c07a;
    --muted:#8a8ca3; --line:rgba(255,255,255,.08); --red:#d76a5c;
    --font-jp:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
    --font-ui:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    --success:#2ecc71;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:radial-gradient(120% 80% at 50% -10%, #2b2e4d 0%, var(--night) 55%),var(--night);color:var(--paper);font-family:var(--font-ui);display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
  .app{width:100%;max-width:460px;min-height:100dvh;display:flex;flex-direction:column;position:relative}

  header{padding:22px 22px 10px;display:flex;align-items:center;justify-content:space-between}
  .who{display:flex;align-items:center;gap:12px}
  .avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(140deg,var(--jade),#5f8f83);display:grid;place-items:center;font-family:var(--font-jp);font-size:20px;color:#0f1a17;font-weight:700}
  .avatar.speaking{animation:pulse 1.4s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(127,176,163,.45)}100%{box-shadow:0 0 0 18px rgba(127,176,163,0)}}
  .who h1{font-size:16px;font-weight:600}
  .who .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .timer{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

  .transcript{flex:1;overflow-y:auto;padding:14px 18px 8px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
  .bubble{max-width:82%;padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word;animation:rise .28s ease}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .bubble .jp{font-family:var(--font-jp)}
  .bubble.ai{align-self:flex-start;background:var(--night-2);border:1px solid var(--line);border-bottom-left-radius:5px}
  .bubble.me{align-self:flex-end;background:var(--coral);color:#2a1712;border-bottom-right-radius:5px}
  .bubble.sys{align-self:center;background:transparent;color:var(--muted);font-size:12.5px;text-align:center;max-width:92%;line-height:1.6}

  .callbar{padding:14px 22px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;border-top:1px solid var(--line);background:linear-gradient(0deg,rgba(0,0,0,.15),transparent)}
  .hint{font-size:12.5px;color:var(--muted);min-height:16px;text-align:center}
  .controls{display:flex;align-items:center;gap:22px}
  .mic{width:76px;height:76px;border-radius:50%;border:none;cursor:pointer;background:var(--coral);color:#2a1712;font-size:28px;display:grid;place-items:center;transition:transform .12s ease,background .2s ease;box-shadow:0 8px 30px -8px var(--coral)}
  .mic:active{transform:scale(.94)}
  .mic.recording{background:#fff;animation:mic-glow 1.1s ease-out infinite}
  @keyframes mic-glow{0%{box-shadow:0 0 0 0 rgba(232,131,107,.5)}100%{box-shadow:0 0 0 22px rgba(232,131,107,0)}}
  .mic:disabled{opacity:.4;cursor:default;box-shadow:none}
  .end{width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;background:var(--red);color:#fff;font-size:22px;display:grid;place-items:center;box-shadow:0 6px 20px -8px var(--red)}
  .end:active{transform:scale(.94)}
  .mini{width:56px;height:56px;border-radius:50%;background:var(--night-2);color:var(--muted);border:1px solid var(--line);cursor:pointer;font-size:20px;display:grid;place-items:center}
  .mini:hover{color:var(--paper)}
  .ctl-label{font-size:10.5px;color:var(--muted);text-align:center;margin-top:3px}
  .ctl">
        <button class="mini" onclick="alert('키보드 입력 기능 준비 중입니다.')">⌨</button>
        <div class="ctl-label">텍스트</div>
      </div>
      <button class="mic" id="micBtn" onclick="toggleRecording()">🎙</button>
      <div class="ctl">
        <button class="end" onclick="endCallAndShowFeedback()">🛑</button>
        <div class="ctl-label">종료</div>
      </div>
    </div>
  </div>

<script>
  let isRecording = false;
  let timerInterval = null;
  let seconds = 0;
  
  let myVocabulary = JSON.parse(localStorage.getItem('moshimoshi_vocab')) || [];
  let quizPool = [];
  let currentQuizIdx = 0;
  let quizScore = 0;

  const sampleAiWords = [
    {word: "コンビニ", furigana: "こんびに", meaning: "편의점"},
    {word: "美味しい", furigana: "おいしい", meaning: "맛있다"},
    {word: "図書館", furigana: "としょかん", meaning: "도서관"},
    {word: "友達", furigana: "ともだ치", meaning: "친구"}
  ];

  function toggleOverlay(id, show) {
    const el = document.getElementById(id);
    if(el) el.style.display = show ? 'flex' : 'none';
  }

  function toggleRecording() {
    const mic = document.getElementById('micBtn');
    const avatar = document.getElementById('avatar');
    isRecording = !isRecording;
    
    if(isRecording) {
        mic.classList.add('recording');
        avatar.classList.add('speaking');
        document.getElementById('statusHint').innerText = "듣고 있습니다... 다 말한 뒤 다시 누르세요";
        if(!timerInterval) startTimer();
        
        setTimeout(() => {
            appendBubble("me", "こんにちは！先生、お元気ですか？");
        }, 1200);
    } else {
        mic.classList.remove('recording');
        avatar.classList.remove('speaking');
        document.getElementById('statusHint').innerText = "분석 완료! 마이크를 눌러 이어가세요";
        
        setTimeout(() => {
            appendBubble("ai", "はい、元気ですよ！今日(きょう)は何(なに)를했습니다か？");
        }, 600);
    }
  }

  function startTimer() {
    timerInterval = setInterval(() => {
        seconds++;
        let min = String(Math.floor(seconds / 60)).padStart(2, '0');
        let sec = String(seconds % 60).padStart(2, '0');
        document.getElementById('callTimer').innerText = `${min}:${sec}`;
    }, 1000);
  }

  function appendBubble(sender, text) {
    const box = document.getElementById('transcriptContainer');
    const b = document.createElement('div');
    b.className = `bubble ${sender}`;
    b.innerHTML = `<span class="jp">${text}</span>`;
    box.appendChild(b);
    box.scrollTop = box.scrollHeight;
  }

  function endCallAndShowFeedback() {
    clearInterval(timerInterval);
    timerInterval = null;
    seconds = 0;
    document.getElementById('callTimer').innerText = "00:00";
    
    renderAiFeedbackWords();
    toggleOverlay('fbOverlay', true);
  }

  function restartCall() {
    toggleOverlay('fbOverlay', false);
    document.getElementById('transcriptContainer').innerHTML = '<div class="bubble sys">🔄 새로운 통화 세션이 시작되었습니다.</div>';
  }

  function goToHome() {
    toggleOverlay('fbOverlay', false);
    toggleOverlay('startOverlay', true);
  }

  function renderAiFeedbackWords() {
    const container = document.getElementById('fbAiWords');
    if(!container) return;
    container.innerHTML = sampleAiWords.map((item, idx) => {
        const isExist = myVocabulary.some(v => v.word === item.word);
        return `
            <div class="word-row">
                <div class="word-info">
                    <span class="jp-w">${item.word}</span>
                    <span class="kr-w">(${item.meaning})</span>
                </div>
                <button class="btn-word-add ${isExist ? 'added' : ''}" 
                        onclick="saveWordToVocab(${idx}, this)" ${isExist ? 'disabled' : ''}>
                    ${isExist ? '담김' : '담기+'}
                </button>
            </div>
        `;
    }).join('');
  }

  function saveWordToVocab(idx, btnEl) {
    const target = sampleAiWords[idx];
    if(!myVocabulary.some(v => v.word === target.word)) {
        myVocabulary.push(target);
        localStorage.setItem('moshimoshi_vocab', JSON.stringify(myVocabulary));
        btnEl.innerText = "담김";
        btnEl.classList.add('added');
        btnEl.disabled = true;
    }
  }

  function openVocabOverlay() {
    renderMyVocabList();
    toggleOverlay('vocabOverlay', true);
  }

  function renderMyVocabList() {
    const container = document.getElementById('vocabList');
    if(!container) return;
    
    document.getElementById('vocabCountBadge').innerText = `(${myVocabulary.length})`;
    
    if(myVocabulary.length === 0) {
        container.innerHTML = '<div style="color:var(--muted); text-align:center; padding:30px 0; font-size:13px; line-height:1.5;">단어장이 비어 있습니다.<br>통화 종료 후 피드백 창에서 단어를 추가해 보세요!</div>';
        document.getElementById('startQuizBtn').style.display = 'none';
        return;
    }
    
    document.getElementById('startQuizBtn').style.display = 'block';
    container.innerHTML = myVocabulary.map((item, idx) => `
        <div class="vocab-item">
            <div>
                <span class="jp-w" style="font-size:15px;">${item.word}</span>
                <span style="color:var(--gold); font-size:11px; margin-left:4px;">[${item.furigana}]</span>
                <div style="color:var(--muted); font-size:12px; margin-top:2px;">${item.meaning}</div>
            </div>
            <button class="vocab-del" onclick="deleteWord(${idx})">❌</button>
        </div>
    `).join('');
  }

  function deleteWord(idx) {
    myVocabulary.splice(idx, 1);
    localStorage.setItem('moshimoshi_vocab', JSON.stringify(myVocabulary));
    renderMyVocabList();
  }

  function initQuizGame() {
    if(myVocabulary.length < 2) {
        alert("퀴즈를 생성하려면 최소 2개 이상의 단어가 단어장에 들어있어야 오답 선지 구성이 가능합니다! 단어를 먼저 모아주세요.");
        return;
    }
    
    quizPool = [...myVocabulary].sort(() => 0.5 - Math.random());
    currentQuizIdx = 0;
    quizScore = 0;
    
    toggleOverlay('vocabOverlay', false);
    toggleOverlay('quizOverlay', true);
    loadQuizQuestion();
  }

  function loadQuizQuestion() {
