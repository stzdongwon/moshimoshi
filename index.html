<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>もしもし — 일본어 통화 연습</title>
<style>
  :root{
    --night:#1a1c2e; --night-2:#242741; --paper:#f4f1ea;
    --coral:#e8836b; --jade:#7fb0a3; --gold:#e6c07a;
    --muted:#8a8ca3; --line:rgba(255,255,255,.08); --red:#d76a5c;
    --font-jp:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
    --font-ui:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:radial-gradient(120% 80% at 50% -10%, #2b2e4d 0%, var(--night) 55%),var(--night);color:var(--paper);font-family:var(--font-ui);display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
  .app{width:100%;max-width:460px;min-height:100dvh;display:flex;flex-direction:column;position:relative}

  header{padding:22px 22px 10px;display:flex;align-items:center;justify-content:space-between}
  .who{display:flex;align-items:center;gap:12px}
  .avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(140deg,var(--jade),#5f8f83);display:grid;place-items:center;font-family:var(--font-jp);font-size:20px;color:#0f1a17;font-weight:700}
  .avatar.speaking{animation:pulse 1.4s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(127,176,163,.45)}100%{box-shadow:0 0 0 18px rgba(127,176,163,0)}}
  .who h1{font-size:16px;font-weight:600}
  .who .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .timer{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

  .transcript{flex:1;overflow-y:auto;padding:14px 18px 8px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
  .bubble{max-width:82%;padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word;animation:rise .28s ease}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .bubble .jp{font-family:var(--font-jp)}
  .bubble.ai{align-self:flex-start;background:var(--night-2);border:1px solid var(--line);border-bottom-left-radius:5px}
  .bubble.me{align-self:flex-end;background:var(--coral);color:#2a1712;border-bottom-right-radius:5px}
  .bubble.sys{align-self:center;background:transparent;color:var(--muted);font-size:12.5px;text-align:center;max-width:92%;line-height:1.6}
  .bubble.quiz{align-self:flex-start;background:linear-gradient(135deg,#2f3358,#242741);border:1px solid var(--line);border-left:3px solid var(--gold)}

  .callbar{padding:14px 22px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;border-top:1px solid var(--line);background:linear-gradient(0deg,rgba(0,0,0,.15),transparent)}
  .hint{font-size:12.5px;color:var(--muted);min-height:16px;text-align:center}
  .controls{display:flex;align-items:center;gap:20px}
  .mic{width:76px;height:76px;border-radius:50%;border:none;cursor:pointer;background:var(--coral);color:#2a1712;font-size:28px;display:grid;place-items:center;transition:transform .12s ease,background .2s ease;box-shadow:0 8px 30px -8px var(--coral)}
  .mic:active{transform:scale(.94)}
  .mic.recording{background:#fff;animation:mic-glow 1.1s ease-out infinite}
  @keyframes mic-glow{0%{box-shadow:0 0 0 0 rgba(232,131,107,.5)}100%{box-shadow:0 0 0 22px rgba(232,131,107,0)}}
  .mic:disabled{opacity:.4;cursor:default;box-shadow:none}
  .end{width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;background:var(--red);color:#fff;font-size:20px;display:grid;place-items:center;box-shadow:0 6px 20px -8px var(--red)}
  .end:active{transform:scale(.94)}
  .mini{width:52px;height:52px;border-radius:50%;background:var(--night-2);color:var(--muted);border:1px solid var(--line);cursor:pointer;font-size:19px;display:grid;place-items:center}
  .mini:hover{color:var(--paper)}
  .ctl-label{font-size:10px;color:var(--muted);text-align:center;margin-top:3px}
  .ctl{display:flex;flex-direction:column;align-items:center}

  .overlay{position:absolute;inset:0;z-index:20;background:rgba(16,17,30,.96);backdrop-filter:blur(6px);display:flex;flex-direction:column;padding:30px 26px;gap:14px;overflow-y:auto}
  .overlay.hidden{display:none}
  .overlay.center{justify-content:center}
  .overlay h2{font-size:22px;font-weight:700;font-family:var(--font-jp)}
  .overlay h2 span{font-family:var(--font-ui);font-size:14px;color:var(--muted);display:block;margin-top:4px;font-weight:400}
  .lvl{display:flex;gap:8px}
  .lvl button{flex:1;padding:11px;border-radius:10px;font-size:13px;cursor:pointer;background:var(--night-2);border:1px solid var(--line);color:var(--muted)}
  .lvl button.on{background:var(--jade);color:#0f1a17;border-color:var(--jade);font-weight:700}
  .note{font-size:12.5px;color:var(--muted);line-height:1.7;background:var(--night-2);padding:14px 16px;border-radius:12px;border:1px solid var(--line)}
  .note b{color:var(--paper)}
  .primary{background:var(--coral);color:#2a1712;border:none;padding:15px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
  .primary:active{transform:scale(.99)}
  .primary.gold{background:var(--gold)}
  .ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:13px;border-radius:12px;font-size:14px;cursor:pointer}
  .ghost:hover{color:var(--paper)}
  .foot{font-size:11px;color:var(--muted);text-align:center;line-height:1.6}

  .fb-title{font-size:20px;font-weight:700}
  .fb-title span{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:3px}
  .fb-card{background:var(--night-2);border:1px solid var(--line);border-radius:14px;padding:16px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
  .fb-card.jp{font-family:var(--font-jp)}
  .fb-loading{color:var(--muted);font-size:14px;text-align:center;padding:20px}
  .spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--jade);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hist-item{background:var(--night-2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;font-size:14px}
  .hist-item:hover{border-color:var(--jade)}
  .hist-item .h-date{color:var(--muted);font-size:12px}
  .hist-empty{color:var(--muted);font-size:13px;text-align:center;padding:20px}

  /* 퀴즈 */
  .quiz-q{font-family:var(--font-jp);font-size:22px;line-height:1.5;text-align:center;padding:24px 10px}
  .quiz-input{width:100%;padding:14px;border-radius:12px;background:var(--night-2);border:1px solid var(--line);color:var(--paper);font-size:16px}
  .quiz-input:focus{outline:none;border-color:var(--jade)}
  .quiz-result{background:var(--night-2);border:1px solid var(--line);border-radius:12px;padding:15px;font-size:14px;line-height:1.7}
  .quiz-score{font-size:13px;color:var(--muted);text-align:center}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
  .badge.ok{background:rgba(127,176,163,.2);color:var(--jade)}
  .badge.no{background:rgba(215,106,92,.2);color:var(--red)}
</style>
</head>
<body>
<div class="app">

  <!-- 시작 화면 -->
  <div class="overlay center" id="startOverlay">
    <h2>もしもし<span>일본어 통화 연습</span></h2>
    <div class="lvl" id="lvlPick">
      <button data-lvl="beginner" class="on">초급 N5-N4</button>
      <button data-lvl="inter">중급 N3-N2</button>
      <button data-lvl="adv">고급 N1</button>
    </div>
    <button class="primary" id="startBtn">📞 통화 시작</button>
    <button class="primary gold" id="quizBtn">✏️ 오늘의 퀴즈</button>
    <button class="ghost" id="histBtn">📋 지난 통화 기록</button>
    <button class="ghost" id="profBtn">🧠 선생님이 기억하는 나</button>
    <div class="foot">아이폰은 Chrome 또는 Safari에서 사용하세요.<br>AI 음성으로 대화합니다.</div>
  </div>

  <!-- 퀴즈 화면 -->
  <div class="overlay" id="quizOverlay" style="display:none">
    <div class="fb-title">오늘의 퀴즈<span>일본어 문장을 한국어로 해석하세요</span></div>
    <div id="quizArea">
      <div class="fb-loading"><div class="spinner"></div>문제를 만들고 있어요...</div>
    </div>
    <div class="quiz-score" id="quizScore"></div>
    <button class="ghost" id="quizCloseBtn">닫기</button>
  </div>

  <!-- 지난 통화 -->
  <div class="overlay" id="histOverlay" style="display:none">
    <div class="fb-title">지난 통화 기록</div>
    <div id="histList"></div>
    <button class="ghost" id="histCloseBtn">닫기</button>
  </div>

  <!-- 프로필 -->
  <div class="overlay" id="profOverlay" style="display:none">
    <div class="fb-title">선생님이 기억하는 나<span>통화할수록 더 잘 알게 돼요</span></div>
    <div id="profBody"></div>
    <button class="ghost" id="profEditBtn">✏️ 직접 수정</button>
    <button class="ghost" id="profClearBtn" style="color:var(--red)">🗑 기억 지우기</button>
    <button class="ghost" id="profCloseBtn">닫기</button>
  </div>

  <!-- 피드백 -->
  <div class="overlay" id="fbOverlay" style="display:none">
    <div class="fb-title">통화 피드백<span id="fbMeta"></span></div>
    <div id="fbBody"><div class="fb-loading"><div class="spinner"></div>대화를 분석하고 있어요...</div></div>
    <button class="primary" id="fbAgainBtn">📞 다시 통화하기</button>
    <button class="ghost" id="fbCloseBtn">닫기</button>
  </div>

  <!-- 통화 화면 -->
  <header>
    <div class="who">
      <div class="avatar" id="avatar">先</div>
      <div><h1>せんせい</h1><div class="sub" id="statusText">연결 준비됨</div></div>
    </div>
    <div class="timer" id="timer">00:00</div>
  </header>

  <div class="transcript" id="transcript"></div>

  <div class="callbar">
    <div class="hint" id="hint">🎙 말하기를 눌러 시작하세요</div>
    <div class="controls">
      <div class="ctl"><button class="mini" id="textBtn">⌨</button><div class="ctl-label">텍스트</div></div>
      <div class="ctl"><button class="mic" id="micBtn">🎙</button><div class="ctl-label" id="micLabel">말하기</div></div>
      <div class="ctl"><button class="end" id="endBtn">📵</button><div class="ctl-label">끊기</div></div>
    </div>
    <div class="ctl" style="margin-top:2px">
      <button class="mini" id="repeatBtn" style="width:auto;height:auto;border-radius:12px;padding:7px 14px;font-size:13px">🔊 다시 듣기</button>
    </div>
  </div>

</div>

<script>
/* =====================================================================
   もしもし v3
   STT: 백엔드 /stt (Whisper)   TTS: 백엔드 /tts (GPT-4o-mini-tts, 사람다운 발음)
   대화/퀴즈/피드백: 백엔드 /chat (GPT)
   기억: localStorage 프로필
   ===================================================================== */
const BACKEND = "https://moshimoshi-backend.hodorigogogo.workers.dev";

const state = {
  level: localStorage.getItem('level')||'beginner',
  history: [], lastAiText:'', busy:false, recording:false,
  startTime:0, timerId:null,
};
let mediaRecorder=null, chunks=[], stream=null, currentAudio=null;

// ---- 프로필(기억) ----
function loadProfile(){try{return localStorage.getItem('profile')||'';}catch(e){return '';}}
function saveProfile(p){try{localStorage.setItem('profile',p||'');}catch(e){}}

function systemPrompt(level){
  const common=`
당신은 나의 일본어 회화 파트너 "선생님(せんせい)"이지만, 실제로는 친한 일본인 친구처럼 편하게 통화하는 사람입니다. 교사가 아니라 대화 상대입니다.

[가장 중요 — 진짜 사람처럼 대화하기]
당신의 목표는 "질문을 던지는 것"이 아니라 "즐거운 대화를 나누는 것"입니다. 실제 사람은 상대에게 질문만 하지 않습니다.

1. 질문은 아껴서 하세요. 매번 질문으로 끝내지 마세요. 2~3번 대화에 1번 정도만 질문하고, 나머지는 아래처럼 반응하세요.
2. 내 말에 구체적으로 반응하세요. "いいですね(좋네요)" 같은 뻔한 말 대신, 내가 말한 특정 내용을 집어서 반응하세요. 예: 내가 "라멘 먹었다"고 하면 → "とんこつ?醤油?僕は味噌が好きなんだ(돈코츠? 쇼유? 나는 미소를 좋아해)"
3. 당신 자신의 이야기도 하세요. 감상, 경험, 취향을 자연스럽게 나누세요. "私も昨日〜(나도 어제~)", "実は〜(사실은~)" 처럼요.
4. 감탄·맞장구·리액션을 풍부하게. "えー!すごい", "へえ〜そうなんだ", "わかる〜", "それは大変だったね" 등. 꼭 대화를 진전시키지 않아도 되는 인간적인 반응이 대화를 편하게 만듭니다.
5. 내 일본어 표현이 좋거나 자연스러우면 가볍게 칭찬하세요. "今の言い方、すごく自然!(방금 그 표현 아주 자연스러워요!)"
6. 상투적인 질문("취미가 뭐예요?", "오늘 뭐 했어요?")을 반복하지 마세요. 대화의 흐름에서 자연스럽게 나온 것에 반응하고, 궁금하면 그것에 대해 더 물으세요.

[분량·톤]
- 한 번에 1~2문장. 통화이므로 짧고 리듬감 있게.
- 친구처럼 편하고 따뜻하게. 가끔 반말·구어체(〜だよ、〜なんだ、〜じゃん)도 자연스럽게 섞으세요.

[한국어 혼용]
- 내가 한국어를 섞거나 한국어로 말해도 멈추지 말고, 그 뜻을 일본어로 어떻게 말하는지 짧게 알려준 뒤 자연스럽게 대화를 이어가세요.

[교정]
- 사소한 실수는 무시하고 대화 흐름을 우선하세요. 의미가 안 통하는 큰 오류만 짧게 짚으세요.

[출력 형식 — 반드시]
JP: <일본어 대사>
KO: <한국어 번역>
- JP 줄엔 일본어만, KO 줄엔 한국어만. 다른 말머리 금지. 교정/힌트는 KO 줄 괄호로 짧게.`;
  const byLevel={beginner:`[수준] 완전 초급 N5~N4. 아주 쉽고 짧은 문장. 단, 딱딱하지 않게 친근하게.`,inter:`[수준] 중급 N3~N2. 일상 회화 표현, 구어체 섞기.`,adv:`[수준] 고급 N1. 원어민처럼 자연스럽고 편하게.`};
  const profile=loadProfile();
  const mem=profile?`\n[학습자에 대해 기억하는 정보 — 자연스럽게 대화에 녹이되 심문하듯 나열하지 마세요. 지난 이야기를 친구처럼 이어가세요]\n${profile}`:'';
  return common+'\n'+(byLevel[level]||byLevel.beginner)+mem;
}
function feedbackPrompt(level){
  return `당신은 일본어 회화 선생님입니다. 아래는 학습자(수준:${level})와의 통화 대화입니다. 피드백을 작성하세요. 한국어 설명, 일본어 예문은 일본어로. 마크다운 기호 쓰지 말고 형식 그대로:

■ 잘한 점
- (구체적 칭찬 1~2가지)

■ 고치면 좋은 점
- (틀렸거나 어색한 표현 1~3개. "❌ → ⭕" 형식, 일본어+한국어)

■ 오늘 나온 표현
- (유용한 표현 3~5개. 일본어 — 한국어 뜻)

■ 다음 연습 제안
- (한 문장)

초급자가 부담 없을 분량, 격려하는 톤으로.`;
}

const $=s=>document.querySelector(s);
const startOverlay=$('#startOverlay'),fbOverlay=$('#fbOverlay'),histOverlay=$('#histOverlay'),profOverlay=$('#profOverlay'),quizOverlay=$('#quizOverlay');
const transcript=$('#transcript'),micBtn=$('#micBtn'),micLabel=$('#micLabel');
const avatar=$('#avatar'),statusText=$('#statusText'),hint=$('#hint'),timerEl=$('#timer');

document.querySelectorAll('#lvlPick button').forEach(b=>{
  b.classList.toggle('on',b.dataset.lvl===state.level);
  b.onclick=()=>{document.querySelectorAll('#lvlPick button').forEach(x=>x.classList.remove('on'));b.classList.add('on');state.level=b.dataset.lvl;};
});

$('#startBtn').onclick=()=>{localStorage.setItem('level',state.level);beginCall();};
$('#fbAgainBtn').onclick=()=>{fbOverlay.style.display='none';beginCall();};
$('#fbCloseBtn').onclick=()=>{fbOverlay.style.display='none';startOverlay.classList.remove('hidden');};
$('#histBtn').onclick=showHistory;
$('#histCloseBtn').onclick=()=>{histOverlay.style.display='none';};

// 프로필
$('#profBtn').onclick=()=>{const p=loadProfile();$('#profBody').innerHTML=p?`<div class="fb-card">${esc(p)}</div>`:`<div class="hist-empty">아직 기억한 정보가 없어요.<br>통화를 하면 선생님이 나를 기억하기 시작해요.</div>`;profOverlay.style.display='flex';};
$('#profCloseBtn').onclick=()=>{profOverlay.style.display='none';};
$('#profEditBtn').onclick=()=>{const cur=loadProfile();const e=prompt('선생님이 기억할 내 정보를 직접 수정하세요:',cur);if(e!==null){saveProfile(e.trim());$('#profBtn').onclick();}};
$('#profClearBtn').onclick=()=>{if(confirm('기억하는 정보를 모두 지울까요?')){saveProfile('');$('#profBtn').onclick();}};

// ---- 백엔드 호출 ----
async function callChat(messages,maxTokens){
  const r=await fetch(BACKEND+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages,maxTokens:maxTokens||400})});
  const data=await r.json();
  if(!r.ok||data.error)throw new Error(data.detail||data.error||'대화 오류');
  return (data.text||'').trim();
}
async function callSTT(blob){
  const form=new FormData();form.append('file',blob,'audio.webm');
  const r=await fetch(BACKEND+'/stt',{method:'POST',body:form});
  const data=await r.json();
  if(!r.ok||data.error)throw new Error(data.detail||data.error||'음성인식 오류');
  return (data.text||'').trim();
}
// TTS: 텍스트 → 백엔드 → mp3 재생 (사람다운 발음)
async function speakBackend(text){
  if(!text)return;
  try{
    if(currentAudio){currentAudio.pause();currentAudio=null;}
    const r=await fetch(BACKEND+'/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,voice:'nova'})});
    if(!r.ok)throw new Error('tts http '+r.status);
    const buf=await r.arrayBuffer();
    const blob=new Blob([buf],{type:'audio/mpeg'});
    const audioUrl=URL.createObjectURL(blob);
    const audio=new Audio(audioUrl);
    currentAudio=audio;
    audio.onplay=()=>avatar.classList.add('speaking');
    audio.onended=()=>{avatar.classList.remove('speaking');URL.revokeObjectURL(audioUrl);};
    await audio.play();
  }catch(e){
    // TTS 실패 시 브라우저 내장 TTS로 폴백
    fallbackSpeak(text);
  }
}
function fallbackSpeak(text){
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=state.level==='beginner'?0.9:1.0;u.onstart=()=>avatar.classList.add('speaking');u.onend=()=>avatar.classList.remove('speaking');speechSynthesis.speak(u);}catch(e){}
}
function stopAllAudio(){if(currentAudio){currentAudio.pause();currentAudio=null;}try{speechSynthesis.cancel();}catch(e){}avatar.classList.remove('speaking');}

function parseReply(raw){let jp='',ko='';raw.split('\n').forEach(line=>{const l=line.trim();if(/^JP[:：]/i.test(l))jp=l.replace(/^JP[:：]/i,'').trim();else if(/^KO[:：]/i.test(l))ko=l.replace(/^KO[:：]/i,'').trim();});if(!jp&&!ko)jp=raw;return{jp,ko};}

// ---- 통화 ----
function beginCall(){
  state.history=[];state.lastAiText='';state.busy=false;
  transcript.innerHTML='';
  startOverlay.classList.add('hidden');fbOverlay.style.display='none';histOverlay.style.display='none';profOverlay.style.display='none';quizOverlay.style.display='none';
  startTimer();startConversation();
}
function startTimer(){state.startTime=Date.now();clearInterval(state.timerId);state.timerId=setInterval(()=>{const s=Math.floor((Date.now()-state.startTime)/1000);timerEl.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');},500);}
function stopTimer(){clearInterval(state.timerId);}

async function startConversation(){
  addSys('통화가 연결되었습니다. 🎙 말하기를 눌러 일본어로 말한 뒤 다시 눌러 정지하세요. 막히면 한국어도 OK.');
  setStatus('선생님이 인사 중...');
  try{
    const msgs=[{role:'system',content:systemPrompt(state.level)},{role:'user',content:'(통화를 시작합니다. 친한 친구에게 전화한 것처럼 밝고 자연스럽게 인사해줘. 지난 대화 기억이 있으면 그걸 자연스럽게 언급하며 시작하고, 없으면 가벼운 스몰토크로 시작해. 뻔한 "오늘 뭐 했어요?"로 시작하지 말 것.)'}];
    const raw=await callChat(msgs);
    state.history.push({role:'user',content:'(start)'});
    state.history.push({role:'assistant',content:raw});
    renderAi(raw);
  }catch(e){addSys('⚠ '+e.message);}
  setStatus('통화 중');
}

function addSys(t){const d=document.createElement('div');d.className='bubble sys';d.textContent=t;transcript.appendChild(d);scrollDown();}
function addMe(t){const d=document.createElement('div');d.className='bubble me';d.innerHTML=`<span class="jp">${esc(t)}</span>`;transcript.appendChild(d);scrollDown();}
function renderAi(raw){const {jp,ko}=parseReply(raw);const d=document.createElement('div');d.className='bubble ai';d.innerHTML=`<span class="jp">${esc(jp)}</span>`+(ko?`<br><span style="color:var(--muted);font-size:13px">${esc(ko)}</span>`:'');transcript.appendChild(d);scrollDown();state.lastAiText=jp;speakBackend(jp);}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function scrollDown(){transcript.scrollTop=transcript.scrollHeight;}
function setStatus(t){statusText.textContent=t;}
$('#repeatBtn').onclick=()=>speakBackend(state.lastAiText);

// ---- 녹음 ----
micBtn.onclick=async()=>{
  if(state.busy)return;
  if(!state.recording){
    try{
      stopAllAudio();
      stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRecorder=new MediaRecorder(stream);chunks=[];
      mediaRecorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
      mediaRecorder.onstop=onRecStop;
      mediaRecorder.start();
      state.recording=true;micBtn.classList.add('recording');micLabel.textContent='정지';
      hint.textContent='🔴 녹음 중... 말한 뒤 다시 누르세요';
    }catch(e){hint.textContent='마이크 권한이 필요해요. 허용 후 다시 시도하세요.';}
  }else{
    mediaRecorder.stop();state.recording=false;micBtn.classList.remove('recording');micLabel.textContent='말하기';
  }
};
async function onRecStop(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  const blob=new Blob(chunks,{type:'audio/webm'});
  state.busy=true;micBtn.disabled=true;hint.textContent='';setStatus('음성 인식 중...');
  try{
    const text=await callSTT(blob);
    if(!text)addSys('소리가 잘 안 들렸어요. 다시 말해보세요.');
    else await handleUserText(text);
  }catch(e){addSys('⚠ '+e.message);}
  setStatus('통화 중');state.busy=false;micBtn.disabled=false;hint.textContent='🎙 말하기를 눌러 이어서 말하세요';
}
$('#textBtn').onclick=()=>{if(state.busy)return;const t=prompt('입력 (일본어·한국어 섞어도 OK):');if(t&&t.trim())handleUserText(t.trim());};

async function handleUserText(text){
  addMe(text);state.history.push({role:'user',content:text});setStatus('선생님이 생각 중...');
  try{
    const msgs=[{role:'system',content:systemPrompt(state.level)},...state.history.map(h=>({role:h.role,content:h.content}))];
    const raw=await callChat(msgs);
    state.history.push({role:'assistant',content:raw});
    renderAi(raw);
  }catch(e){addSys('⚠ '+e.message);}
  setStatus('통화 중');
  if(state.history.length>40)state.history=state.history.slice(-40);
}

// ---- 끊기 → 피드백 + 저장 + 기억갱신 ----
$('#endBtn').onclick=endCall;
async function endCall(){
  if(state.recording){try{mediaRecorder.stop();}catch(e){}state.recording=false;}
  stopAllAudio();stopTimer();
  const userTurns=state.history.filter(h=>h.role==='user'&&h.content!=='(start)').length;
  if(userTurns===0){startOverlay.classList.remove('hidden');return;}
  fbOverlay.style.display='flex';
  const dur=timerEl.textContent;
  $('#fbMeta').textContent=`통화 시간 ${dur} · ${userTurns}번 대화`;
  $('#fbBody').innerHTML='<div class="fb-loading"><div class="spinner"></div>대화를 분석하고 있어요...</div>';
  const convo=state.history.filter(h=>h.content!=='(start)').map(h=>{if(h.role==='user')return '학습자: '+h.content;const {jp,ko}=parseReply(h.content);return '선생님: '+jp+(ko?` (${ko})`:'');}).join('\n');
  let fbText='';
  try{
    fbText=await callChat([{role:'system',content:feedbackPrompt(state.level)},{role:'user',content:'대화 기록:\n\n'+convo}],700);
    $('#fbBody').innerHTML=`<div class="fb-card jp">${esc(fbText)}</div>`;
  }catch(e){fbText='(생성 실패)';$('#fbBody').innerHTML=`<div class="fb-card">⚠ 피드백 생성 실패: ${esc(e.message||'')}<br><br>대화는 저장되었어요.</div>`;}
  saveCall(dur,userTurns,convo,fbText);
  updateProfile(convo);
}

async function updateProfile(convo){
  const prev=loadProfile();
  const prompt=`아래는 일본어 학습자와의 통화입니다. 장기 기억할 정보만 추려 프로필로 정리하세요. 포함: 이름,직업/학교,사는곳,취미·관심사,가족·반려동물,근황·계획,좋아하는것,학습목표. 제외: 잡담,인사,교정내용.

기존 프로필:
${prev||'(없음)'}

이번 대화:
${convo}

기존에 새 정보를 합쳐 간결한 항목 나열로 출력. 한국어. 중복 합치고 바뀐 정보는 최신으로. 설명 문장 없이 프로필만.`;
  try{const t=await callChat([{role:'user',content:prompt}],400);if(t)saveProfile(t);}catch(e){}
}

function saveCall(dur,turns,convo,feedback){try{const c=JSON.parse(localStorage.getItem('calls')||'[]');c.unshift({date:new Date().toISOString(),dur,turns,convo,feedback});localStorage.setItem('calls',JSON.stringify(c.slice(0,30)));}catch(e){}}
function showHistory(){histOverlay.style.display='flex';const list=$('#histList');let calls=[];try{calls=JSON.parse(localStorage.getItem('calls')||'[]');}catch(e){}if(!calls.length){list.innerHTML='<div class="hist-empty">아직 저장된 통화가 없어요.</div>';return;}list.innerHTML='';calls.forEach(c=>{const d=new Date(c.date);const ds=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;const it=document.createElement('div');it.className='hist-item';it.innerHTML=`<div class="h-date">${ds} · ${c.dur} · ${c.turns}번 대화</div>`;it.onclick=()=>{histOverlay.style.display='none';fbOverlay.style.display='flex';$('#fbMeta').textContent=`${ds} · ${c.dur}`;$('#fbBody').innerHTML=`<div class="fb-card jp">${esc(c.feedback||'(없음)')}</div>`;};list.appendChild(it);});}

/* ============ 퀴즈 기능 ============ */
let quiz={items:[],idx:0,correct:0};
$('#quizBtn').onclick=startQuiz;
$('#quizCloseBtn').onclick=()=>{quizOverlay.style.display='none';};

async function startQuiz(){
  quizOverlay.style.display='flex';
  quiz={items:[],idx:0,correct:0};
  $('#quizScore').textContent='';
  $('#quizArea').innerHTML='<div class="fb-loading"><div class="spinner"></div>문제를 만들고 있어요...</div>';
  const profile=loadProfile();
  const prompt=`일본어 학습자(수준:${state.level})를 위한 "일본어→한국어 해석" 퀴즈를 만드세요.
${profile?'학습자 관심사를 반영하면 좋음: '+profile:''}
서로 다른 일본어 문장 5개를 JSON 배열로만 출력. 형식: [{"jp":"일본어 문장","answer":"자연스러운 한국어 해석"}]
수준에 맞는 실용 회화 문장으로. JSON 외 다른 텍스트 절대 금지.`;
  try{
    let raw=await callChat([{role:'user',content:prompt}],700);
    raw=raw.replace(/```json|```/g,'').trim();
    quiz.items=JSON.parse(raw);
    if(!Array.isArray(quiz.items)||!quiz.items.length)throw new Error('형식 오류');
    renderQuizItem();
  }catch(e){
    $('#quizArea').innerHTML=`<div class="quiz-result">⚠ 문제 생성 실패: ${esc(e.message||'')}<br>다시 시도해주세요.</div>`;
  }
}
function renderQuizItem(){
  const it=quiz.items[quiz.idx];
  $('#quizScore').textContent=`${quiz.idx+1} / ${quiz.items.length}`;
  $('#quizArea').innerHTML=`
    <div class="quiz-q">${esc(it.jp)}</div>
    <button class="mini" id="qSpeak" style="width:auto;height:auto;border-radius:12px;padding:8px 14px;margin:0 auto 14px;display:block">🔊 듣기</button>
    <input class="quiz-input" id="qInput" placeholder="한국어로 해석을 입력하세요" autocomplete="off">
    <button class="primary" id="qSubmit" style="margin-top:12px">제출</button>
  `;
  $('#qSpeak').onclick=()=>speakBackend(it.jp);
  const inp=$('#qInput');inp.focus();
  const submit=()=>gradeQuiz(inp.value.trim());
  $('#qSubmit').onclick=submit;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
}
async function gradeQuiz(userAnswer){
  if(!userAnswer)return;
  const it=quiz.items[quiz.idx];
  $('#quizArea').innerHTML='<div class="fb-loading"><div class="spinner"></div>채점 중...</div>';
  const prompt=`일본어 문장: "${it.jp}"
모범 한국어 해석: "${it.answer}"
학습자가 입력한 해석: "${userAnswer}"

학습자의 해석이 의미상 맞는지 판정하세요. 사소한 표현 차이는 정답으로 인정(뜻이 통하면 OK). 아래 JSON만 출력:
{"correct":true 또는 false,"comment":"짧은 한국어 피드백(왜 맞았는지/틀렸는지, 자연스러운 해석 제시)"}
JSON 외 텍스트 금지.`;
  let res={correct:false,comment:''};
  try{let raw=await callChat([{role:'user',content:prompt}],300);raw=raw.replace(/```json|```/g,'').trim();res=JSON.parse(raw);}catch(e){res={correct:false,comment:'채점 오류. 모범답안: '+it.answer};}
  if(res.correct)quiz.correct++;
  const last=quiz.idx>=quiz.items.length-1;
  $('#quizArea').innerHTML=`
    <div class="quiz-q" style="font-size:19px">${esc(it.jp)}</div>
    <div class="quiz-result">
      <span class="badge ${res.correct?'ok':'no'}">${res.correct?'정답':'아쉬워요'}</span>
      <div style="margin-top:8px">내 해석: ${esc(userAnswer)}</div>
      <div style="margin-top:4px;color:var(--jade)">모범: ${esc(it.answer)}</div>
      <div style="margin-top:8px;color:var(--muted)">${esc(res.comment||'')}</div>
    </div>
    <button class="primary" id="qNext" style="margin-top:14px">${last?'결과 보기':'다음 문제'}</button>
  `;
  $('#qNext').onclick=()=>{
    if(last){
      $('#quizArea').innerHTML=`<div class="quiz-result" style="text-align:center">
        <div style="font-size:32px;margin-bottom:8px">${quiz.correct===quiz.items.length?'🎉':'💪'}</div>
        <div style="font-size:18px;font-weight:700">${quiz.items.length}문제 중 ${quiz.correct}개 정답!</div>
      </div>
      <button class="primary gold" id="qAgain" style="margin-top:14px">새 문제 풀기</button>`;
      $('#quizScore').textContent='';
      $('#qAgain').onclick=startQuiz;
    }else{quiz.idx++;renderQuizItem();}
  };
}
</script>
</body>
</html>
